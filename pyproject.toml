[project]
name = "stagger"
version = "0.1.0"
description = "Shoot a crash-test robot; an RL policy (PPO, MuJoCo) keeps it on its feet."
requires-python = ">=3.11"
dependencies = [
  "mujoco==3.14.0",  # pinned: must match @mujoco/mujoco in web/package.json (parity)
  "gymnasium",
  "stable-baselines3[extra]",
  "torch",
  "tensorboard",
  "pyyaml",
  "matplotlib",
  "imageio[ffmpeg]",
  "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stagger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
